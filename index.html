<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Today's Games</title>
<style>
  :root {
    --bg: #0B0F14;
    --card: #12181F;
    --text: #FFFFFF;
    --muted: #8A94A6;
    --faint: #5A6472;
    --divider: #1E2630;
    --accent: #E8B33C;
    --live: #34C759;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 6px; }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.02em; }
  .date { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .updated { font-size: 12px; color: var(--faint); }
  .refresh {
    margin-left: auto;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--divider);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh:active { background: var(--divider); }
  /* Sport filter as one segmented control: a single rounded bar with the
     options inside it, the active one in gold. Scrolls sideways on narrow
     phones instead of wrapping, matching the day tabs above it. */
  .filters { display: flex; gap: 4px; margin: 12px 0 4px; background: var(--card); border: 1px solid var(--divider); border-radius: 999px; padding: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .filter-btn.active { background: var(--accent); color: #0B0F14; }
  /* Week view (Michael, 2026-11-17): seven day tabs across the top
     (today + 6 days). Tapping a day shows that day's games. The row
     scrolls horizontally on narrow phones; the selected day is gold. */
  .daytabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0 4px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .daytabs::-webkit-scrollbar { display: none; }
  .day-btn {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--divider);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .day-btn.active { background: var(--accent); color: #0B0F14; border-color: var(--accent); }
  .day-btn.pending { opacity: 0.55; }
  /* "Sort by" sits outside the bubble as plain text, so it never looks
     tappable. The toggle itself is the same segmented bar as the filters. */
  .sort-wrap { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .sort-wrap .filters { flex: 0 1 auto; min-width: 0; margin: 0; }
  .sort-label { font-size: 13px; color: var(--muted); font-weight: 700; margin-right: 2px; }
  .section-title {
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
    color: var(--muted); margin: 22px 0 10px;
  }
  .sport-title {
    font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
    color: #FFFFFF; margin: 14px 0 6px;
  }
  .nascar {
    background: var(--card);
    border: 1px solid var(--divider);
    border-left: 3px solid var(--accent);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .nascar .name { font-size: 15px; font-weight: 700; }
  .nascar .when { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .game {
    display: block;
    background: var(--card);
    border: 1px solid var(--divider);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
  }
  .game:active { background: #171E27; }
  /* ESPN-style card: a header row (sport/network left, status right) and
     one row per team — logo, name, record, and the score in large bold
     type on the right. While a game is live both scores are the same
     color; once it is final the winning score stands out and the losing
     one goes muted. Same dark theme, same information. */
  .game-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .game-head .head-left { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .game-head .sport { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .game-head .pin { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 0.05em; white-space: nowrap; }
  .game-head .status { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .game-head .status.live { color: var(--live); }
  .game-head .status.final { color: var(--muted); font-weight: 600; }
  .team { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .team img { width: 32px; height: 32px; object-fit: contain; flex: none; }
  .team .rank { color: var(--accent); font-weight: 800; font-size: 15px; flex: none; }
  .team .name { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .team .rec { color: var(--muted); font-weight: 600; font-size: 13px; flex: none; }
  .team .score { margin-left: auto; font-size: 22px; font-weight: 800; line-height: 1; flex: none; }
  .team .score.losing { color: var(--muted); font-weight: 700; }
  .empty { color: var(--muted); font-size: 15px; padding: 12px 2px; }
  .error { color: var(--muted); font-size: 14px; padding: 16px 2px; line-height: 1.5; }
  footer { margin-top: 24px; font-size: 12px; color: var(--faint); line-height: 1.6; }
  .loading { color: var(--muted); font-size: 15px; padding: 24px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TODAY'S GAMES</h1>
    <span class="date" id="date"></span>
  </header>
  <div class="meta">
    <span class="updated" id="updated"></span>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>
  <div class="daytabs" id="dayTabs"></div>
  <div class="filters" id="filters"></div>
  <div class="sort-wrap"><span class="sort-label">Sort by</span><div class="filters sort-row" id="sortRow"></div></div>
  <div id="app"><div class="loading">Loading today's games…</div></div>
  <footer>Live scores from ESPN. Times Eastern. Refreshes every 60 seconds while games are live.</footer>
</div>

  // within the card instead of overflowing.)
  function matchupParts(g) {
    return g.teams.map(function (t) {
      return { rank: t.rank || null, name: t.name, record: t.record || null };
    });
  }
  function logoUrl(sport, teamId) {
    if (!teamId) return null;
    if (sport === "CFB" || sport === "CBB") return "https://a.espncdn.com/i/teamlogos/ncaa/500-dark/" + teamId + ".png";
    if (sport === "MLB") return "https://a.espncdn.com/i/teamlogos/mlb/500/" + teamId + ".png";
    // NFL has no dark variant (nfl/500-dark 404s — verified 2026-11-16).
    if (sport === "NFL") return "https://a.espncdn.com/i/teamlogos/nfl/500/" + teamId + ".png";
    return null;
  }
  function isNationalTV(broadcasts) {
    for (var i = 0; i < broadcasts.length; i++) {
      if (NATIONAL_TV.indexOf(String(broadcasts[i]).trim().toUpperCase()) !== -1) return true;
    }
    return false;
  }
  // NFL divisions by team abbreviation (for the "divisional matchup" test).
  // ESPN uses WSH for Washington; WAS is included as a safety net.
  var NFL_DIVISIONS = {
    BUF: "AFCE", MIA: "AFCE", NE: "AFCE", NYJ: "AFCE",
    BAL: "AFCN", CIN: "AFCN", CLE: "AFCN", PIT: "AFCN",
    HOU: "AFCS", IND: "AFCS", JAX: "AFCS", TEN: "AFCS",
    DEN: "AFCW", KC: "AFCW", LV: "AFCW", LAC: "AFCW",
    DAL: "NFCE", NYG: "NFCE", PHI: "NFCE", WSH: "NFCE", WAS: "NFCE",
    CHI: "NFCN", DET: "NFCN", GB: "NFCN", MIN: "NFCN",
    ATL: "NFCS", CAR: "NFCS", NO: "NFCS", TB: "NFCS",
    ARI: "NFCW", LAR: "NFCW", SF: "NFCW", SEA: "NFCW",
  };
  // Primetime NFL windows: NBC carries only Sunday Night Football, ESPN
  // only Monday Night Football, Prime Video only Thursday Night Football,
  // so the broadcast network alone identifies the primetime slot.
  var NFL_PRIMETIME = ["NBC", "ESPN", "PRIME VIDEO", "AMAZON PRIME VIDEO"];
  function isNflPrimetime(g) {
    for (var i = 0; i < g.broadcasts.length; i++) {
      if (NFL_PRIMETIME.indexOf(String(g.broadcasts[i]).trim().toUpperCase()) !== -1) return true;
    }
    return false;
  }
  function isNflDivisional(g) {
    if (g.teams.length < 2) return false;
    var d0 = NFL_DIVISIONS[g.teams[0].abbr], d1 = NFL_DIVISIONS[g.teams[1].abbr];
    return d0 && d0 === d1;
  }
  // A "good" NFL game: a playoff game, a primetime game, a divisional game,
  // a matchup of two good teams (both .500 or better, or combined .600+),
  // or a live game that's still close (within 7 points). NFL has no
  // rankings, so these are the quality signals. Only good games are
  // collected — and on the page they sit below the other sports.
  function isGoodNflGame(g) {
    if (g.playoff) return true;
    if (isNflPrimetime(g)) return true;
    if (isNflDivisional(g)) return true;
    var pcts = g.teams.map(function (t) { return t.winPct; });
    if (pcts.length === 2 && pcts[0] !== null && pcts[1] !== null) {
      if (pcts[0] >= 0.5 && pcts[1] >= 0.5) return true;
      if ((pcts[0] + pcts[1]) / 2 >= 0.6) return true;
    }
    if (g.state === "in" && g.teams.length === 2 && g.teams[0].score !== null && g.teams[1].score !== null) {
      if (Math.abs(g.teams[0].score - g.teams[1].score) <= 7) return true;
    }
    return false;
  }
  function isMaryland(g) {
    return g.teams.some(function (t) {
      return t.abbr === "MD" || String(t.name).indexOf("Maryland") !== -1;
    });
  }

  function normName(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  }
  function isFoxBroadcast(broadcasts) {
    for (var i = 0; i < broadcasts.length; i++) {
      var b = String(broadcasts[i]).trim().toUpperCase();
      if (b === "FOX" || b === "FS1") return true;
    }
    return false;
  }

  // Add one Fox scoreboard segment's FOX/FS1 games to the map, keyed by
  // "AWAY|HOME|YYYY-MM-DD" (team abbreviations, Eastern date) to the Fox
  // game page URL. Two keys per game are stored (abbreviations and
  // normalized long names) because ESPN and Fox occasionally abbreviate a
  // team differently; the lookup tries both, forward and reversed, and
  // falls back to the ESPN link on any miss.
  function foxEventsToMap(segmentData, map) {
    if (!segmentData || !segmentData.sectionList) return;
    segmentData.sectionList.forEach(function (sec) {
      (sec.events || []).forEach(function (ev) {
        if (ev.tvStation !== "FOX" && ev.tvStation !== "FS1") return;
        var webUrl = ev.entityLink && ev.entityLink.webUrl;
        if (!webUrl) return;
        var up = ev.upperTeam || {}, low = ev.lowerTeam || {};
        var ymd = ymdOf(new Date(ev.eventTime));
        var url = FOX_WEB + webUrl;
        var abbrKey = String(up.name || "").toUpperCase() + "|" + String(low.name || "").toUpperCase() + "|" + ymd;
        var nameKey = normName(up.longName) + "|" + normName(low.longName) + "|" + ymd;
        map[abbrKey] = url;
        map[nameKey] = url;
        // Reversed (home|away) as a safety net in case one provider
        // lists the teams in the opposite order.
        map[String(low.name || "").toUpperCase() + "|" + String(up.name || "").toUpperCase() + "|" + ymd] = url;
        map[normName(low.longName) + "|" + normName(up.longName) + "|" + ymd] = url;
      });
    });
  }

  // Week IDs (current week + next) for a weekly sport like CFB, from the
  // scoreboard/main response. Today and tomorrow can straddle a week
  // boundary, so both weeks are fetched.
  function foxWeekIds(main) {
    var sels = [];
    ((main && main.selectionGroupList) || []).forEach(function (grp) {
      (grp.selectionList || []).forEach(function (s) { sels.push(s); });
    });
    var cur = main && main.currentSelectionId;
    for (var i = 0; i < sels.length; i++) {
      if (sels[i].id === cur) {
        var ids = [sels[i].id];
        if (i + 1 < sels.length) ids.push(sels[i + 1].id);
        return ids;
      }
    }
    return [];
  }

  // Resolve Fox game URLs for the sports that have FOX/FS1 games. ymds is
  // the list of Eastern dates to fetch daily segments for (CBB/MLB). CFB
  // is weekly, so it goes through scoreboard/main to find the week
  // segments; CBB and MLB are daily, so their segment URLs are built
  // straight from each date.
  async function fetchFoxLinks(sports, ymds) {
    var map = {};
    var jobs = [];
    function segUrl(slug, segmentId, groupId) {
      return FOX_API_BASE + "/" + slug + "/scoreboard/segment/" + segmentId +
        "?groupId=" + groupId + "&apikey=" + FOX_API_KEY + "&api-version=1.1";
    }
    sports.forEach(function (sport) {
      var slug = FOX_SPORT_SLUGS[sport];
      if (!slug) return;
      if (sport === "CFB") {
        jobs.push((async function () {
          var main = await fetchJSON(FOX_API_BASE + "/cfb/scoreboard/main?apikey=" + FOX_API_KEY + "&api-version=1.1");
          var weeks = foxWeekIds(main);
          var segs = await Promise.all(weeks.map(function (w) { return fetchJSON(segUrl("cfb", w, 2)); }));
          segs.forEach(function (s) { foxEventsToMap(s, map); });
        })());
      } else {
        ymds.forEach(function (ymd) {
          jobs.push((async function () {
            var seg = await fetchJSON(segUrl(slug, ymd.replace(/-/g, ""), 2));
            foxEventsToMap(seg, map);
          })());
        });
      }
    });
    await Promise.all(jobs);
    return map;
  }

  function foxLinkFor(g, map) {
    if (!g.teams || g.teams.length < 2) return null;
    var a = g.teams[0], b = g.teams[1];
    var keys = [
      String(a.abbr || "").toUpperCase() + "|" + String(b.abbr || "").toUpperCase() + "|" + g.ymd,
      normName(a.name) + "|" + normName(b.name) + "|" + g.ymd,
      String(b.abbr || "").toUpperCase() + "|" + String(a.abbr || "").toUpperCase() + "|" + g.ymd,
      normName(b.name) + "|" + normName(a.name) + "|" + g.ymd,
    ];
    for (var i = 0; i < keys.length; i++) {
      if (map[keys[i]]) return map[keys[i]];
    }
    return null;
  }

  function nextNascar(todayYmd) {
    var today = dateFromYmd(todayYmd);
    var list = NASCAR_SCHEDULE
      .filter(function (r) { return !r.exhibition || CONFIG.includeNascarExhibitions; })
      .filter(function (r) { return r.date >= todayYmd; })
      .filter(function (r) { return Math.round((dateFromYmd(r.date) - today) / 86400000) <= CONFIG.nascarShowWithinDays; })
      .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    return list.length ? list[0] : null;
  }

  function rankSum(g) { return g.teams.reduce(function (s, t) { return s + (t.rank || 99); }, 0); }
  function hasFavConf(g) {
    var confs = FAV_CONFERENCES[g.sport] || [];
    return g.teams.some(function (t) { return confs.indexOf(t.conf) !== -1; });
  }
  function combinedWinPct(g) {
    var pcts = g.teams.map(function (t) { return t.winPct; }).filter(function (p) { return p !== null; });
    if (!pcts.length) return -1;
    return pcts.reduce(function (a, b) { return a + b; }, 0) / pcts.length;
  }
  function isBlowout(g) {
    if (g.state !== "in" || g.teams.length < 2) return false;
    var s0 = g.teams[0].score, s1 = g.teams[1].score;
    if (s0 === null || s1 === null) return false;
    return Math.abs(Number(s0) - Number(s1)) >= (BLOWOUT_MARGIN[g.sport] || 20);
  }
  function isTop5Matchup(g) {
    return g.teams.length === 2 && g.teams.every(function (t) { return t.rank && t.rank <= 5; });
  }
  // NOTE: the widget demotes very late kickoffs (after 9:30 PM) so a
  // 10:30 PM game does not take one of its 3 slots in the morning. That
  // rule is widget-only (Michael, 2026-11-14): on this full page there
  // is room for every game, so Best games ranks by true priority and a
  // late ranked-vs-ranked game like Utah–Arizona stays near the top.
  function watchCompare(a, b) {
    var so = (SPORT_ORDER[a.sport] || 0) - (SPORT_ORDER[b.sport] || 0);
    if (so) return so;
    if (a.sport === "MLB") {
      var mwp = combinedWinPct(b) - combinedWinPct(a);
      if (mwp) return mwp;
    }
    // Competitiveness first: ranked-vs-ranked beats one ranked team, which
    // beats none — then two quality teams beats one, which beats none.
    var rc = rankedCount(b) - rankedCount(a);
    if (rc) return rc;
    var qc = qualityCount(b) - qualityCount(a);
    if (qc) return qc;
    // When both games are ranked-vs-ranked, the lowest combined rank wins
    // first (Michael, 2026-11-16): #5 vs #10 (sum 15) outranks #14 vs #2
    // (sum 16), even when the records differ. For other games, records
    // still decide before ranks.
    if (rankedCount(a) === 2 && rankedCount(b) === 2) {
      var rs0 = rankSum(a) - rankSum(b);
      if (rs0) return rs0;
    }
    // Then both teams' records (matters most for football, mid/late season).
    var wp = combinedWinPct(b) - combinedWinPct(a);
    if (wp) return wp;
    var fav = (hasFavConf(b) ? 1 : 0) - (hasFavConf(a) ? 1 : 0);
    if (fav) return fav;
    var rs = rankSum(a) - rankSum(b);
    if (rs) return rs;
    return a.date - b.date;
  }
  function stateClass(g) {
    if (g.state === "in") return isBlowout(g) ? 2 : 0;
    if (g.state === "pre") return 1;
    return 3;
  }
  function orderGames(games) {
    var list = games.slice();
    // NFL is the lowest priority (Michael, 2026-11-16): it is separated
    // out first so that even a playoff or live-close NFL game never jumps
    // ahead of a CFB/CBB/MLB/LLWS game. Within NFL, the same state-class
    // + watch order applies.
    var nfl = list.filter(function (g) { return g.sport === "NFL"; });
    var nonNfl = list.filter(function (g) { return g.sport !== "NFL"; });
    var playoffs = nonNfl.filter(function (g) { return g.playoff; });
    var rest = nonNfl.filter(function (g) { return !g.playoff; });
    var matchups = rest.filter(isTop5Matchup).sort(function (a, b) {
      var fav = (hasFavConf(b) ? 1 : 0) - (hasFavConf(a) ? 1 : 0);
      if (fav) return fav;
      return rankSum(a) - rankSum(b) || (a.date - b.date);
    });
    var pinned = matchups.find(function (g) { return !isBlowout(g); }) || null;
    var others = rest.filter(function (g) { return g !== pinned; });
    others.sort(function (a, b) { return stateClass(a) - stateClass(b) || watchCompare(a, b); });
    playoffs.sort(function (a, b) { return stateClass(a) - stateClass(b) || watchCompare(a, b); });
    nfl.sort(function (a, b) { return stateClass(a) - stateClass(b) || watchCompare(a, b); });
    return { ordered: playoffs.concat(pinned ? [pinned] : []).concat(others).concat(nfl), pinned: pinned };
  }

  async function fetchJSON(url) {
    try {
      var res = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!res.ok) return null;
      return await res.json();
    } catch (e) { return null; }
  }

  async function fetchBoardsFor(dateStr) {
    var compact = dateStr.replace(/-/g, "");
    var results = await Promise.all([
      fetchJSON(URLS.cfbScores + "?dates=" + compact),
      fetchJSON(URLS.cbbScores + "?dates=" + compact),
      fetchJSON(URLS.mlbScores + "?dates=" + compact),
      fetchJSON(URLS.llbScores + "?dates=" + compact),
      fetchJSON(URLS.nflScores + "?dates=" + compact),
    ]);
    utcBoards[dateStr] = { cfb: results[0], cbb: results[1], mlb: results[2], llb: results[3], nfl: results[4] };
  }

  // Build one Eastern day's games from the two dates= fetches that cover
  // it (its own date and the next one, for late-night games). Returns
  // { ymd, ordered, maryland } where ordered/maryland are orderGames()
  // results.
  function buildDay(ymd) {
    var nextYmd = addDaysYmd(ymd, 1);
    var games = [], md = [];
    function collectFrom(dateStr, ranks, sport, keep) {
      var sb = utcBoards[dateStr];
      if (!sb) return;
      var board = sb[SPORT_BOARD_KEY[sport]];
      if (!board || !board.events) return;
      board.events.forEach(function (ev) {
        var g = parseEvent(ev, ranks, sport);
        g.sport = sport;
        if (!keep(g, ev)) return;
        if (g.ymd === ymd) games.push(g);
      });
    }
    collectFrom(ymd, cfbRanks, "CFB", function (g) { return g.teams.some(function (t) { return t.rank; }); });
    collectFrom(nextYmd, cfbRanks, "CFB", function (g) { return g.teams.some(function (t) { return t.rank; }); });
    collectFrom(ymd, cbbRanks, "CBB", function (g) { return g.teams.some(function (t) { return t.rank; }); });
    collectFrom(nextYmd, cbbRanks, "CBB", function (g) { return g.teams.some(function (t) { return t.rank; }); });
    collectFrom(ymd, null, "MLB", function (g) {
      return g.teams.some(function (t) { return t.abbr === "BAL"; }) || isNationalTV(g.broadcasts);
    });
    collectFrom(nextYmd, null, "MLB", function (g) {
      return g.teams.some(function (t) { return t.abbr === "BAL"; }) || isNationalTV(g.broadcasts);
    });
    collectFrom(ymd, null, "LLWS", function (g, ev) {
      var comp = (ev.competitions && ev.competitions[0]) || {};
      var notes = comp.notes || [];
      return notes.some(function (n) { return String(n.headline || "").indexOf("Little League Baseball World Series") !== -1; });
    });
    collectFrom(nextYmd, null, "LLWS", function (g, ev) {
      var comp = (ev.competitions && ev.competitions[0]) || {};
      var notes = comp.notes || [];
      return notes.some(function (n) { return String(n.headline || "").indexOf("Little League Baseball World Series") !== -1; });
    });
    // NFL: good games only (primetime, playoffs, good records, divisional,
    // live close). On the page they appear in their own group below the
    // other sports, and the NFL filter button only shows when NFL games
    // are in the lists.
    collectFrom(ymd, null, "NFL", function (g) { return isGoodNflGame(g); });
    collectFrom(nextYmd, null, "NFL", function (g) { return isGoodNflGame(g); });
    // Maryland football, even when unranked — the full view includes it.
    // (Ranked Maryland games already appear in the main lists; this section
    // only shows the ones that would otherwise be missing.)
    function collectMarylandFrom(dateStr) {
      var sb = utcBoards[dateStr];
      if (!sb || !sb.cfb || !sb.cfb.events) return;
      sb.cfb.events.forEach(function (ev) {
        var g = parseEvent(ev, cfbRanks, "CFB");
        g.sport = "CFB";
        if (!isMaryland(g)) return;
        if (g.ymd !== ymd) return;
        var inMain = games.some(function (x) { return x.id === g.id; });
        if (!inMain) md.push(g);
      });
    }
    collectMarylandFrom(ymd);
    collectMarylandFrom(nextYmd);
    return { ymd: ymd, ordered: orderGames(games), maryland: orderGames(md) };
  }

  // Attach Fox deep links to a list of built days. Fox-broadcast games
  // link to their Fox game page (opens the Fox Sports app) instead of
  // ESPN; games with no Fox match keep their ESPN link.
  async function resolveFoxForDays(dayObjs, ymds) {
    var allGames = [];
    dayObjs.forEach(function (dayObj) {
      allGames = allGames.concat(dayObj.ordered.ordered).concat(dayObj.maryland.ordered);
    });
    var foxSports = {};
    allGames.forEach(function (g) { if (isFoxBroadcast(g.broadcasts)) foxSports[g.sport] = true; });
    var foxSportList = Object.keys(foxSports);
    if (!foxSportList.length) return;
    var foxMap = await fetchFoxLinks(foxSportList, ymds);
    allGames.forEach(function (g) {
      if (isFoxBroadcast(g.broadcasts)) {
        var fl = foxLinkFor(g, foxMap);
        if (fl) g.foxLink = fl;
      }
    });
  }

  function recomputeAnyFeed() {
    week.anyFeed = Object.keys(utcBoards).some(function (k) {
      var b = utcBoards[k];
      return b && (b.cfb || b.cbb || b.mlb || b.llb || b.nfl);
    });
  }

  // Stage 1: today's boards (today + tomorrow, for late-night games) and
  // the rankings. Renders today as soon as it is ready.
  async function initWeek() {
    var now = new Date();
    week.todayYmd = ymdOf(now);
    week.now = now;
    dayYmds = [];
    for (var i = 0; i < WEEK_DAYS; i++) dayYmds.push(addDaysYmd(week.todayYmd, i));
    currentDay = 0;
    await Promise.all([
      fetchBoardsFor(dayYmds[0]),
      fetchBoardsFor(dayYmds[1]),
      fetchJSON(URLS.cfbRanks).then(function (r) { cfbRanks = rankMap(r, "Playoff"); }),
      fetchJSON(URLS.cbbRanks).then(function (r) { cbbRanks = rankMap(r, "AP Top 25"); }),
    ]);
    recomputeAnyFeed();
    week.nascar = nextNascar(week.todayYmd);
    dayData[dayYmds[0]] = buildDay(dayYmds[0]);
    await resolveFoxForDays([dayData[dayYmds[0]]], [dayYmds[0], dayYmds[1]]);
    render();
    // Stage 2: the rest of the week, in the background.
    loadRemainingDays();
  }

  // Stage 2: fetch the remaining dates (two per batch, so one burst
  // doesn't trip ESPN's rate limit), build days 1–6, resolve their Fox
  // links, and re-render.
  async function loadRemainingDays() {
    var extra = addDaysYmd(dayYmds[6], 1);
    var needed = dayYmds.slice(2).concat([extra]);
    for (var i = 0; i < needed.length; i += 2) {
      var batch = needed.slice(i, i + 2);
      await Promise.all(batch.map(function (d) { return fetchBoardsFor(d); }));
    }
    var later = [];
    for (var d = 1; d < WEEK_DAYS; d++) {
      var dayObj = buildDay(dayYmds[d]);
      dayData[dayYmds[d]] = dayObj;
      later.push(dayObj);
    }
    recomputeAnyFeed();
    await resolveFoxForDays(later, dayYmds);
    render();
  }

  // Refresh only the selected day (and the rankings); other days keep
  // their cached data. A midnight rollover rebuilds the whole week.
  async function refresh() {
    if (!dayYmds.length) return;
    var now = new Date();
    if (ymdOf(now) !== dayYmds[0]) {
      if (typeof location !== "undefined" && location.reload) location.reload();
      return;
    }
    var ymd = dayYmds[currentDay];
    var next = addDaysYmd(ymd, 1);
    await Promise.all([
      fetchBoardsFor(ymd),
      fetchBoardsFor(next),
      fetchJSON(URLS.cfbRanks).then(function (r) { cfbRanks = rankMap(r, "Playoff"); }),
      fetchJSON(URLS.cbbRanks).then(function (r) { cbbRanks = rankMap(r, "AP Top 25"); }),
    ]);
    dayData[ymd] = buildDay(ymd);
    await resolveFoxForDays([dayData[ymd]], [ymd, next]);
    render();
  }

  // ESPN-style game card (restyled 2026-11-16): a header row with the
  // sport/network on the left and the status on the right (live clock in
  // green with the dot, Final, or the start time), then one row per team
  // — logo, rank, full name, record, and the score in large bold type on
  // the right. While a game is live both scores are the same color; once
  // it is final the winning score stands out and the losing one goes
  // muted. Pre-game rows have no score — the start time is in the header.
  // Nothing the old card showed is removed.
  function gameRowHTML(g, pinned) {
    var parts = matchupParts(g);
    var net = (g.broadcasts[0] || "").toUpperCase();
    var sub = g.sport + (net ? " · " + net : "");
    if (g.sport === "LLWS" && g.round) sub += " · " + esc(g.round);
    var status = "", statusCls = "";
    if (g.state === "in") { status = "● " + esc(g.detail); statusCls = "live"; }
    else if (g.state === "post") { status = "Final"; statusCls = "final"; }
    else { status = esc(g.time); }
    var pinTag = pinned ? '<span class="pin">TOP 5</span>' : "";
    var s0 = g.teams.length > 0 ? g.teams[0].score : null;
    var s1 = g.teams.length > 1 ? g.teams[1].score : null;
    var rows = g.teams.map(function (t, i) {
      var logo = logoUrl(g.sport, t.id);
      var img = logo ? '<img src="' + esc(logo) + '" alt="" onerror="this.style.display=\'none\'">' : "";
      var p = parts[i];
      var rank = p.rank ? '<span class="rank">#' + p.rank + "</span>" : "";
      var rec = p.record ? '<span class="rec">' + esc(p.record) + "</span>" : "";
      var scoreHtml = "";
      if (g.state !== "pre" && t.score !== null) {
        // A live 0–0 reads "0" on each row, never dashes (Michael, 2026-11-14).
        // Winner/loser emphasis is final-only (Michael, 2026-11-16): while a
        // game is live both scores are the same color; only once it is final
        // does the winning score stand out and the losing one go muted.
        var losing = (g.state === "post" && s0 !== null && s1 !== null && ((i === 0 && Number(s0) < Number(s1)) || (i === 1 && Number(s1) < Number(s0))));
        scoreHtml = '<span class="score' + (losing ? " losing" : "") + '">' + esc(String(t.score)) + "</span>";
      }
      return '<div class="team">' + img + rank + '<span class="name">' + esc(p.name) + "</span>" + rec + scoreHtml + "</div>";
    }).join("");
    var inner = '<div class="game-head"><span class="head-left"><span class="sport">' + esc(sub) + "</span>" + pinTag + '</span><span class="status ' + statusCls + '">' + status + "</span></div>" + rows;
    // Fox-broadcast games link to their Fox game page (opens the Fox Sports
    // app on iOS); everything else links to its ESPN boxscore/gamecast.
    var href = g.foxLink || g.link;
    if (href) return '<a class="game" href="' + esc(href) + '" target="_blank" rel="noopener">' + inner + "</a>";
    return '<div class="game">' + inner + "</div>";
  }

  var SPORT_LABELS = { MLB: "Baseball", LLWS: "Little League World Series", CFB: "College Football", CBB: "College Basketball", NFL: "NFL" };
  var SPORT_GROUP_ORDER = ["MLB", "LLWS", "CFB", "CBB", "NFL"]; // same sport priority as the widget

  // Sport filter (toggle buttons at the top of the page). "ALL" shows every
  // sport; picking one sport shows only that sport's games, so there is no
  // need to scroll to the bottom to find it. The choice survives the 60s
  // auto-refresh. LLWS only gets a button when LLWS games are actually
  // happening, matching the rule that LLWS UI stays hidden out of season.
  var FILTER_LABELS = { ALL: "All", CFB: "College Football", CBB: "College Basketball", MLB: "Baseball", LLWS: "Little League", NFL: "NFL" };
  var currentFilter = "ALL";
  var filterSportsSig = "";
  var filterDirty = true;

  // ---------- WEEK VIEW (Michael, 2026-11-17) ----------
  // Seven day tabs across the top (today + 6 days). Tapping a day shows
  // that day's games; the sport filter and sort apply to the selected day
  // and keep their choice when switching days. Each day's games are
  // fetched with explicit dates= params — the default scoreboard feed is
  // unreliable (the widget's no-games bug, 2026-11-17: it returned almost
  // nothing for today), so every day is fetched by date.
  var WEEK_DAYS = 7;
  var dayYmds = [];      // 7 Eastern ymd strings, index 0 = today
  var dayData = {};      // ymd -> { ordered, pinned, maryland } (absent while loading)
  var currentDay = 0;    // selected day index
  var week = { todayYmd: null, nascar: null, anyFeed: false, now: null };
  var cfbRanks = {}, cbbRanks = {};
  // Raw scoreboard JSONs by the dates= string they were fetched with.
  // A day's games come from two fetches (its own date and the next one):
  // a game late at night Eastern (e.g. 11 PM) falls on the next UTC date,
  // so its Eastern day is only covered by fetching both.
  var utcBoards = {};    // dateStr -> { cfb, cbb, mlb, llb, nfl }
  var SPORT_BOARD_KEY = { CFB: "cfb", CBB: "cbb", MLB: "mlb", LLWS: "llb", NFL: "nfl" };

  // Calendar-date arithmetic on a yyyy-MM-dd string (no timezone drift).
  function addDaysYmd(ymd, n) {
    var p = ymd.split("-");
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10) + n, 12, 0, 0));
    var m = String(d.getUTCMonth() + 1), day = String(d.getUTCDate());
    return d.getUTCFullYear() + "-" + (m.length < 2 ? "0" + m : m) + "-" + (day.length < 2 ? "0" + day : day);
  }
  // Tab label for a day: "Today 11/17" for today, "Wed 11/18" otherwise.
  function dayTabLabel(ymd, idx) {
    var p = ymd.split("-");
    var md = parseInt(p[1], 10) + "/" + parseInt(p[2], 10);
    if (idx === 0) return "Today " + md;
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0));
    var wd = new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "short" }).format(d);
    return wd + " " + md;
  }
  // Long section title for a day: "TODAY", "TOMORROW", or "WEDNESDAY, NOVEMBER 18".
  function dayTitle(idx) {
    if (idx === 0) return "TODAY";
    if (idx === 1) return "TOMORROW";
    var p = dayYmds[idx].split("-");
    var d = new Date(Date.UTC(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10), 12, 0, 0));
    return new Intl.DateTimeFormat("en-US", { timeZone: "UTC", weekday: "long", month: "long", day: "numeric" }).format(d).toUpperCase();
  }
  // Short label for messages: "Today", "Tomorrow", or "Wed 11/18".
  function dayShortLabel(idx) {
    if (idx === 0) return "Today";
    if (idx === 1) return "Tomorrow";
    return dayTabLabel(dayYmds[idx], idx);
  }

  // Sort order for the game lists (Michael, 2026-11-14). "best" is the
  // priority order (playoffs, pinned top-5, live close, upcoming, blowouts,
  // finals, grouped by sport). "time" is a single chronological list per
  // day, earliest kickoff first, across all sports — the day's schedule
  // (football, basketball, baseball, Little League all by start time).
  // The choice survives the 60s auto-refresh and future visits
  // (localStorage), and it applies to the Today, Tomorrow and Maryland
  // sections alike.
  var SORT_LABELS = { best: "Best games", time: "Start time" };
  var currentSort = "best";
  try {
    var savedSort = window.localStorage.getItem("gamesSort");
    if (savedSort === "time" || savedSort === "best") currentSort = savedSort;
  } catch (e) {}

  // One day's games. In "best" sort they are grouped under a subheading per
  // sport so football and basketball are easy to tell apart at a glance,
  // and within each sport the priority order is kept (playoffs, pinned
  // top-5, live close, upcoming, blowouts, finals). In "time" sort the day
  // is a single chronological list across all sports, earliest kickoff
  // first — the day's schedule; each row's sub-line already names its
  // sport ("CFB · ABC"), so no sport subheadings are needed. Same-start
  // ties keep the priority order (Array sort is stable). When a single
  // sport is picked, a day with no games in that sport is hidden entirely
  // instead of showing "No games.", and the sport subheading is skipped
  // because the filter button already names the sport.
  function sectionHTML(title, ordered, pinned, filter) {
    var list = filter === "ALL" ? ordered : ordered.filter(function (g) { return g.sport === filter; });
    if (!list.length) {
      if (filter === "ALL") return '<div class="section-title">' + esc(title) + '</div><div class="empty">No games.</div>';
      return "";
    }
    var html = '<div class="section-title">' + esc(title) + "</div>";
    if (currentSort === "time") {
      var byTime = list.slice().sort(function (a, b) { return a.date - b.date; });
      byTime.forEach(function (g) { html += gameRowHTML(g, pinned && g === pinned); });
      return html;
    }
    // Live and upcoming games first, grouped by sport. Completed games
    // go to the very bottom of the section under their own heading
    // (Michael, 2026-11-14), so a finished game never sits above a game
    // still to come. Each row's sub-line already names its sport, so the
    // Completed group needs no sport subheadings.
    var active = list.filter(function (g) { return g.state !== "post"; });
    var finals = list.filter(function (g) { return g.state === "post"; });
    SPORT_GROUP_ORDER.forEach(function (sport) {
      var games = active.filter(function (g) { return g.sport === sport; });
      if (!games.length) return;
      if (filter === "ALL") html += '<div class="sport-title">' + esc(SPORT_LABELS[sport] || sport) + "</div>";
      games.forEach(function (g) { html += gameRowHTML(g, pinned && g === pinned); });
    });
    if (finals.length) {
      html += '<div class="sport-title">Completed</div>';
      finals.forEach(function (g) { html += gameRowHTML(g, pinned && g === pinned); });
    }
    return html;
  }

  function renderSort() {
    var btns = "";
    ["best", "time"].forEach(function (s) {
      btns += '<button class="filter-btn' + (currentSort === s ? " active" : "") + '" type="button" data-sort="' + s + '">' + esc(SORT_LABELS[s]) + "</button>";
    });
    document.getElementById("sortRow").innerHTML = btns;
  }

  // The filter buttons reflect the selected day's sports. The current
  // filter's button stays visible even on a day where that sport has no
  // games, so the choice stays visible (and the empty message below
  // explains it) instead of silently vanishing.
  function renderFilters(sports) {
    var btns = '<button class="filter-btn' + (currentFilter === "ALL" ? " active" : "") + '" type="button" data-sport="ALL">All</button>';
    SPORT_GROUP_ORDER.forEach(function (sport) {
      if (!sports[sport] && sport !== currentFilter) return;
      btns += '<button class="filter-btn' + (currentFilter === sport ? " active" : "") + '" type="button" data-sport="' + sport + '">' + esc(FILTER_LABELS[sport] || sport) + "</button>";
    });
    document.getElementById("filters").innerHTML = btns;
  }

  function renderTabs() {
    var btns = "";
    dayYmds.forEach(function (ymd, i) {
      var loaded = !!dayData[ymd];
      btns += '<button class="day-btn' + (i === currentDay ? " active" : "") + (loaded ? "" : " pending") + '" type="button" data-day="' + i + '">' + esc(dayTabLabel(ymd, i)) + "</button>";
    });
    document.getElementById("dayTabs").innerHTML = btns;
  }

  // Renders the selected day. The filter and sort choices survive day
  // switches, and the NASCAR banner (relative to today, not the selected
  // day) stays at the top whenever a race is near.
  function render() {
    renderTabs();
    var app = document.getElementById("app");
    var ymd = dayYmds[currentDay];
    var dayObj = ymd ? dayData[ymd] : null;
    if (!dayObj) {
      app.innerHTML = '<div class="loading">Loading games for ' + esc(dayShortLabel(currentDay)) + '…</div>';
      return;
    }
    if (!week.anyFeed) {
      app.innerHTML = '<div class="error">Couldn\'t load scores from ESPN right now. Check your connection and tap Refresh.</div>';
      return;
    }
    // Rebuild the filter buttons only when the set of sports with games
    // changes or the picked filter changed, so an auto-refresh never
    // rebuilds them (and steals a tap) while the user is interacting.
    var sports = {};
    dayObj.ordered.ordered.forEach(function (g) { sports[g.sport] = true; });
    dayObj.maryland.ordered.forEach(function (g) { sports[g.sport] = true; });
    var sig = SPORT_GROUP_ORDER.filter(function (s) { return sports[s]; }).join(",");
    if (filterDirty || sig !== filterSportsSig) {
      filterSportsSig = sig;
      filterDirty = false;
      renderFilters(sports);
    }
    var html = "";
    if (week.nascar) {
      var d = dateFromYmd(week.nascar.date);
      var isRaceDay = week.nascar.date === week.todayYmd;
      html += '<div class="nascar"><div class="name">🏁 ' + esc(week.nascar.name) + (isRaceDay ? " — TODAY" : "") + '</div>' +
        '<div class="when">NASCAR · ' + esc(shortDateOf(d)) + " · " + esc(week.nascar.network) + " · " + (week.nascar.time ? esc(week.nascar.time) : "Time TBA") + "</div></div>";
    }
    var dayHtml = sectionHTML(dayTitle(currentDay), dayObj.ordered.ordered, dayObj.ordered.pinned, currentFilter);
    var mdHtml = "";
    if (dayObj.maryland.ordered.length) {
      mdHtml = sectionHTML("MARYLAND", dayObj.maryland.ordered, dayObj.maryland.pinned, currentFilter);
    }
    if (!dayHtml && !mdHtml) {
      // The filter hides everything on this day (or the day genuinely
      // has no games in that sport) — say so instead of a blank page.
      if (currentFilter !== "ALL") {
        html += '<div class="empty">No ' + esc(FILTER_LABELS[currentFilter] || currentFilter) + ' games on ' + esc(dayShortLabel(currentDay)) + '.</div>';
      } else {
        html += '<div class="empty">No games.</div>';
      }
    } else {
      html += dayHtml + mdHtml;
    }
    app.innerHTML = html;
    document.getElementById("updated").textContent = "Updated " + timeOf(new Date());
    document.getElementById("date").textContent = shortDateOf(new Date()).toUpperCase();
  }

  var timer = null;
  function start() {
    document.getElementById("date").textContent = shortDateOf(new Date()).toUpperCase();
    document.getElementById("refreshBtn").addEventListener("click", refresh);
    // One delegated listener on the filter row: the buttons are rebuilt
    // whenever the sports change, but this listener survives the rebuild.
    document.getElementById("filters").addEventListener("click", function (e) {
      var sport = e.target && e.target.dataset ? e.target.dataset.sport : null;
      if (!sport || sport === currentFilter) return;
      currentFilter = sport;
      filterDirty = true;
      render();
    });
    // Day tabs: tapping a day shows that day's games. The filter and
    // sort choices carry over; a day whose data hasn't arrived yet shows
    // a loading state until the background load finishes.
    document.getElementById("dayTabs").addEventListener("click", function (e) {
      var day = e.target && e.target.dataset ? e.target.dataset.day : null;
      if (day === null || day === undefined) return;
      var idx = parseInt(day, 10);
      if (isNaN(idx) || idx === currentDay || idx < 0 || idx >= WEEK_DAYS) return;
      currentDay = idx;
      filterDirty = true;
      render();
    });
    // Sort toggle (Best games / Start time). The buttons are static, so
    // they are built once here; tapping one re-sorts the lists in place
    // and remembers the choice for future visits.
    renderSort();
    document.getElementById("sortRow").addEventListener("click", function (e) {
      var sort = e.target && e.target.dataset ? e.target.dataset.sort : null;
      if (!sort || sort === currentSort) return;
      currentSort = sort;
      try { window.localStorage.setItem("gamesSort", sort); } catch (err) {}
      renderSort();
      render();
    });
    initWeek();
    timer = setInterval(function () { refresh(); }, CONFIG.refreshSeconds * 1000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) refresh();
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();
</script>
</body>
</html>
